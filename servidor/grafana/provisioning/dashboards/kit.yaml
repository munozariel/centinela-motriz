# Le dice a Grafana que cargue los dashboards de la carpeta json/ al arrancar.
apiVersion: 1

providers:
  - name: kit
    folder: Kit de monitoreo
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/provisioning/dashboards/json
