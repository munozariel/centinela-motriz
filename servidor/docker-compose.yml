# Servidor del kit de monitoreo: PostgreSQL + n8n + Grafana
# Detrás del nginx del host. Todos los puertos quedan solo en 127.0.0.1.
# Uso:   docker compose up -d
# Nunca usar "down -v". Los datos viven en DATA_DIR, fuera de este repositorio.

name: monitor

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
      TZ: UTC
    volumes:
      - ${DATA_DIR:?}/postgres:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro      # solo corre con la carpeta de datos vacía
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5
    logging: &logs
      options:
        max-size: "10m"
        max-file: "3"

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:?}
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: n8n.${DOMINIO}
      N8N_PROTOCOL: https
      N8N_PROXY_HOPS: 1
      WEBHOOK_URL: https://n8n.${DOMINIO}/
      GENERIC_TIMEZONE: America/Argentina/Buenos_Aires
      TZ: America/Argentina/Buenos_Aires
      N8N_DIAGNOSTICS_ENABLED: "false"
      # Las ejecuciones guardan los headers, con el token del kit en claro. n8n las marca para borrar
      # al terminar y las elimina en la limpieza periódica: se baja de 15 minutos a 1.
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_PRUNE_HARD_DELETE_INTERVAL: 1
      EXECUTIONS_DATA_MAX_AGE: 168
    volumes:
      - ${DATA_DIR:?}/n8n:/home/node/.n8n
    ports:
      - "127.0.0.1:5680:5678"
    logging: *logs

  grafana:
    image: grafana/grafana-oss:${GRAFANA_VERSION:?}
    restart: unless-stopped
    mem_limit: 384m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SERVER_ROOT_URL: https://grafana.${DOMINIO}/
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: America/Argentina/Buenos_Aires
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - ${DATA_DIR:?}/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3300:3000"
    logging: *logs
